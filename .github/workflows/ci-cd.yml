name: CI/CD Deployment with Portainer Auto JWT

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env: # GitHub runner env
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
      ENDPOINT_ID: 3
      ECR_USERNAME: ${{ secrets.ECR_USERNAME }}
      ECR_PASSWORD: ${{ secrets.ECR_PASSWORD }}
      FIREBASE_TYPE: ${{ secrets.FIREBASE_TYPE }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
      FIREBASE_AUTH_URI: ${{ secrets.FIREBASE_AUTH_URI }}
      FIREBASE_TOKEN_URI: ${{ secrets.FIREBASE_TOKEN_URI }}
      FIREBASE_AUTH_PROVIDER_CERT_URL: ${{ secrets.FIREBASE_AUTH_PROVIDER_CERT_URL }}
      FIREBASE_CLIENT_CERT_URL: ${{ secrets.FIREBASE_CLIENT_CERT_URL }}
      AllowedOrigins: ${{ secrets.AllowedOrigins }}
      MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
      MONGODB_DATABASE_NAME: ${{ secrets.MONGODB_DATABASE_NAME }}
      MONGODB_USER_COLLECTION_NAME: ${{ secrets.MONGODB_USER_COLLECTION_NAME }}
      MONGODB_PRE_APPROVAL_COLLECTION_NAME: ${{ secrets.MONGODB_PRE_APPROVAL_COLLECTION_NAME }}
      FirebaseKey: ${{ secrets.FirebaseKey }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE ./LoanPortal.API
          docker push $IMAGE

      - name: Generate Portainer JWT token
        id: portainer_token
        run: |
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${PORTAINER_USERNAME}\", \"password\": \"${PORTAINER_PASSWORD}\"}" \
            ${PORTAINER_URL}/api/auth | jq -r '.jwt')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to get Portainer JWT token" && exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Redeploy stack via Portainer API
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.portainer_token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{
                  \"env\": [
                    { \"name\": \"repo\", \"value\": \"${ECR_REPOSITORY}\" },
                    { \"name\": \"tag\", \"value\": \"${IMAGE_TAG}\" },
                    { \"name\": \"FIREBASE_TYPE\", \"value\": \"${FIREBASE_TYPE}\" },
                    { \"name\": \"FIREBASE_PROJECT_ID\", \"value\": \"${FIREBASE_PROJECT_ID}\" },
                    { \"name\": \"FIREBASE_PRIVATE_KEY_ID\", \"value\": \"${FIREBASE_PRIVATE_KEY_ID}\" },
                    { \"name\": \"FIREBASE_CLIENT_EMAIL\", \"value\": \"${FIREBASE_CLIENT_EMAIL}\" },
                    { \"name\": \"FIREBASE_CLIENT_ID\", \"value\": \"${FIREBASE_CLIENT_ID}\" },
                    { \"name\": \"FIREBASE_AUTH_URI\", \"value\": \"${FIREBASE_AUTH_URI}\" },
                    { \"name\": \"FIREBASE_TOKEN_URI\", \"value\": \"${FIREBASE_TOKEN_URI}\" },
                    { \"name\": \"FIREBASE_AUTH_PROVIDER_CERT_URL\", \"value\": \"${FIREBASE_AUTH_PROVIDER_CERT_URL}\" },
                    { \"name\": \"FIREBASE_CLIENT_CERT_URL\", \"value\": \"${FIREBASE_CLIENT_CERT_URL}\" },
                    { \"name\": \"AllowedOrigins\", \"value\": \"${AllowedOrigins}\" },
                    { \"name\": \"MONGODB_CONNECTION_STRING\", \"value\": \"${MONGODB_CONNECTION_STRING}\" },
                    { \"name\": \"MONGODB_DATABASE_NAME\", \"value\": \"${MONGODB_DATABASE_NAME}\" },
                    { \"name\": \"MONGODB_USER_COLLECTION_NAME\", \"value\": \"${MONGODB_USER_COLLECTION_NAME}\" },
                    { \"name\": \"MONGODB_PRE_APPROVAL_COLLECTION_NAME\", \"value\": \"${MONGODB_PRE_APPROVAL_COLLECTION_NAME}\" },
                    { \"name\": \"FirebaseKey\", \"value\": \"${FirebaseKey}\" },
                    { \"name\": \"FIREBASE_PRIVATE_KEY\", \"value\": \"${FIREBASE_PRIVATE_KEY}\" }
                  ],
                  \"prune\": true,
                  \"pullImage\": true,
                  \"repositoryAuthentication\": true,
                  \"repositoryUsername\": \"${ECR_USERNAME}\",
                  \"repositoryPassword\": \"${ECR_PASSWORD}\"
                }" \
            "${PORTAINER_URL}/api/stacks/${PORTAINER_STACK_ID}/git/redeploy?endpointId=${ENDPOINT_ID}"
